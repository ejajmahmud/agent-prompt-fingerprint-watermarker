[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-prompt-fingerprint-watermarker"
version = "0.1.0"
description = "Discrete distribution watermarking engine embedding tamper-evident cryptographic provenance proofs into generated agent outputs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-prompt-fingerprint-watermarker = "agent_prompt_fingerprint_watermarker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_prompt_fingerprint_watermarker*"]
